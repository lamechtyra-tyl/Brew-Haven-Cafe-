<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="image.jpg/logo.shopc.jpeg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Haven Cafe` | Contact</title>
</head>
<body>
    <header>
        <a href="home.html" class="logo"><img src="image.jpg/logo.shopc.jpeg" alt="haven logo">
            <h1>Brew Haven Cafe`</h1></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
    </header>
    <main>
        <section class="page-banner">
            <p class="eyebrow">WE WOULD LOVE TO HEAR FROM YOU</p>
            <h1>Contact Us</h1>
            <p>Questions, feedback or just want to say hello?</p>
        </section>
        <section class="contact-layout">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <p>We are always happy to hear from our customers.</p>
                <p><strong>Location:</strong>Nairobi, Kenya</p>
                <p><strong>Phone:</strong>+254745932665</p>
                <p><strong>Email:</strong>brewHaven@gmail.com</p>
                <h3>Find Us</h3>
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15954.860365658342!2d36.71043414071048!3d-1.3474228207889682!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2ske!4v1792305965212!5m2!1sen!2ske" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
                 frameborder="0"></iframe>
            </div>
            <div class="form-container">
                <h2>Place an Order</h2>
                <form action="#" method="post">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your Full Name" required>
                     <label for="email">Email Address</label>
                     <input type="email" id="email" name="email" placeholder="Enter Your Email Address" required>
                     <label for="phone">Phone Number</label>
                     <input type="tel" id="phone" name="phone" placeholder="+2547XXXXXXXX" required>
                     <label for="coffee">Choose Your Coffee</label>
                     <select name="coffee" id="coffee" required><option value="">Select a coffee</option>
                    <option value="Expresso">Expresso - KSh 200</option>
                    <option value="Cappuccino">Cappuccino - KSh 300</option>
                <option value="Iced Latte">Iced Latte - KSh 400</option></select>
                <label for="snack">Choose a snack</label>
                <select name="snack" id="snack"><option value="">No snack</option>
                <option value="Chocolate Muffin">Chocolate Muffin - KSh 200</option>
            <option value="Butter Croissant">Butter Croissant - KSh 250</option></select>
            <label for="quantity">Coffee Quantity</label>
            <input type="number" id="quantity" name="quantity" min="1" max="20" value="1" required>
            <label for="order-type">Order Type</label>
            <select name="order-type" id="order-type" required><option value="">Choose order type</option>
            <option value="Pickup">Pickup</option>
        <option value="Delivery">Delivery</option>
         <option value="Dine-in">Dine-in</option></select>
         <label for="address">Delivery Address (if applicable)</label>
         <textarea name="address" id="address" rows="3" placeholder="Enter Your Delivery Location"></textarea>
         <label for="instructions">Special Instructions</label>
         <textarea name="instructions" id="instructions" rows="3" placeholder="E.g. less sugar, extra milk..."></textarea>
         <button type="submit" class="btn">Place Order</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
